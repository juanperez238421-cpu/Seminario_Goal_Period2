name: Validate master dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/diagnostics/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run syntax checks and unit tests
        id: validation
        shell: bash
        run: |
          set +e
          mkdir -p data/diagnostics
          {
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            npm run check
            CHECK_STATUS=$?
            echo
            echo "check_status=$CHECK_STATUS"
            echo
            npm test
            TEST_STATUS=$?
            echo
            echo "test_status=$TEST_STATUS"
            echo "check_status=$CHECK_STATUS" >> "$GITHUB_OUTPUT"
            echo "test_status=$TEST_STATUS" >> "$GITHUB_OUTPUT"
          } 2>&1 | tee data/diagnostics/quality-latest.txt
          exit 0

      - name: Commit validation diagnostic
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/diagnostics/quality-latest.txt; then
            echo "No diagnostic changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diagnostics/quality-latest.txt
          git commit -m "chore(ci): record dashboard validation [skip ci]"
          git push

      - name: Fail when validation fails
        if: steps.validation.outputs.check_status != '0' || steps.validation.outputs.test_status != '0'
        run: exit 1
