name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure master and local project review entry points
        run: |
          python - <<'PY'
          from pathlib import Path

          master = Path("index.html")
          html = master.read_text(encoding="utf-8")
          marker = '<div class="topbar-actions">'
          link = '<a class="button secondary" href="project-review.html">Revisar proyectos locales</a>'
          old_link = '<a class="button secondary" href="project-review.html">Revisar proyectos</a>'
          html = html.replace(old_link, link)
          if link not in html and marker in html:
              html = html.replace(marker, f"{marker}\n      {link}", 1)
          master.write_text(html, encoding="utf-8")

          review = Path("project-review.html")
          review_html = review.read_text(encoding="utf-8")
          review_html = review_html.replace(
              'src="js/project-review.js"',
              'src="js/project-review-local.js"'
          )
          review_html = review_html.replace(
              "El modo commit carga una copia estática del SHA seleccionado. No modifica el repositorio del estudiante.",
              "La página abre la copia completa almacenada en este repositorio maestro y asociada al SHA monitoreado."
          )
          review_html = review_html.replace(
              "Detectar y ejecutar",
              "Abrir copia local"
          )
          review_html = review_html.replace(
              "Selecciona un estudiante y pulsa <strong>Abrir copia local</strong>. Podrás escoger cualquiera de sus páginas HTML.",
              "Selecciona un estudiante y abre su copia central. Podrás escoger cualquiera de las páginas HTML guardadas en el repositorio maestro."
          )
          review_html = review_html.replace(
              "funciona para proyectos web públicos de HTML, CSS y JavaScript. Los programas de Python, Java, servidores o bases de datos necesitan ejecutarse en el computador del estudiante.",
              "la automatización copia cada repositorio web vinculado dentro de student-projects/. Python, Java, servidores y bases de datos deben ejecutarse en el computador del estudiante."
          )
          review.write_text(review_html, encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
