name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add live project review entry point
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("index.html")
          html = page.read_text(encoding="utf-8")
          marker = '<div class="topbar-actions">'
          link = '<a class="button secondary" href="project-review.html">Revisar proyectos</a>'
          if link not in html and marker in html:
              html = html.replace(marker, f"{marker}\n      {link}", 1)
              page.write_text(html, encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
