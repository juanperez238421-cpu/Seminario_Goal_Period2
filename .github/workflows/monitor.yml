name: Monitor mirror and score student repositories

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/students.json"
      - "scripts/project-audit.mjs"
      - "scripts/monitor-repos-v2.mjs"
      - "package.json"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: seminar-repository-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate monitoring code
        run: npm run check

      - name: Consult copy and score public student repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run monitor

      - name: Commit monitoring audits and local project mirrors
        run: |
          CHANGES="$(git status --porcelain -- data/monitor student-projects)"
          if [ -z "$CHANGES" ]; then
            echo "No monitoring, audit or local project changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monitor student-projects
          git commit -m "chore(monitor): refresh project mirrors and technical scores"
          git push
