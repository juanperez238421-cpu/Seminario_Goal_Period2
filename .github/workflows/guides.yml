name: Generate student PDF guides

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-pdf-guides.py"
      - "scripts/generate-session-guides.py"
      - "data/students.json"
      - "data/completion-model.json"
      - "student-projects/index.json"
      - "student-projects/**/manifest.json"
      - ".github/workflows/guides.yml"

permissions:
  contents: write

concurrency:
  group: seminar-pdf-guides
  cancel-in-progress: true

jobs:
  build-guides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-lang-spanish \
            texlive-fonts-recommended \
            zip

      - name: Remove previous generated archive
        run: rm -f guides/seminario_guias_2026_07_29.zip

      - name: Generate general and individual LaTeX guides
        run: python scripts/generate-pdf-guides.py

      - name: Generate focused interview sheets and rebuild archive
        run: python scripts/generate-session-guides.py

      - name: Commit generated guides
        run: |
          CHANGES="$(git status --porcelain -- guides)"
          if [ -z "$CHANGES" ]; then
            echo "No guide changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guides
          git commit -m "docs(guides): refresh focused interview PDF sheets"
          git push
